<!DOCTYPE html>
<html>
<head>
    <title>AI Study Assistant</title>
    <link rel-"stylesheet" href="/static/style.css">
</head>

<body>

<h1>AI Study Assistant</h1>

<p>Upload your lecture notes in a pdf file and let the AI help you study!</p>

<form action="/upload" method="POST" enctype="multipart/form-data">

    <input type="file" name="pdf">

    <button type="Submit">
        Upload PDF
    </button>

</form>

<h2>Ask a question about your lecture notes:</h2>
<form action="/ask" method="POST">

    <input type="text" name="question" placeholder="Ask something about your notes...">
    <button type="submit">
        Ask AI
    </button>
</form>

{% if upload_message %}
    <p>{{ upload_message }}</p>
{% endif %}

{% if ai_answer %}
    <h3>AI Answer:</h3>
    <p>{{ ai_answer }}</p>
{% endif %}

</body>
</html>
