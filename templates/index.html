<!DOCTYPE html>
<html>

<head>
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header>

        <h1>AI Study Assistant</h1>

        <p>
            Upload your lecture notes and let AI help you revise more effectively.
        </p>

    </header>


    <div class="top-section">

        <div class="card">

            <h2>Upload Lecture Notes</h2>

            <form action="/upload" method="POST" enctype="multipart/form-data">

                <input type="file" name="pdf">

                <button type="submit">
                    Upload PDF
                </button>

            </form>

            {% if upload_message %}
                <p>{{ upload_message }}</p>
            {% endif %}

        </div>


        <div class="card">

            <h2>Ask a Question</h2>

            <form action="/ask" method="POST">

                <input
                    type="text"
                    name="question"
                    placeholder="Ask something about your lecture notes..."
                    required
                >

                <button type="submit">
                    Ask AI
                </button>

            </form>

        </div>

    </div>


    <div class="card">

        <h2>AI Answer</h2>

        {% if ai_answer %}

            <p>{{ ai_answer }}</p>

        {% else %}

            <p>Your answer will appear here.</p>

        {% endif %}

    </div>

</div>

</body>

</html>
